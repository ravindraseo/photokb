<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-cam-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="fav-cam-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Shutter Button -->
  <rect x="20" y="14" width="15" height="8" rx="4" fill="#1e40af" />

  <!-- Top Viewfinder Bump -->
  <path d="M36 22 L42 12 C43 10.5 44.5 10 46 10 L54 10 C55.5 10 57 10.5 58 12 L64 22 Z" fill="url(#fav-cam-blue)" />

  <!-- Camera Body -->
  <rect x="8" y="22" width="84" height="68" rx="20" fill="url(#fav-cam-blue)" />

  <!-- Highlight Line -->
  <path d="M20 27 H80" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- Outer Lens Ring (White) -->
  <circle cx="50" cy="57" r="23" fill="#ffffff" />

  <!-- Inner Lens Housing (Dark) -->
  <circle cx="50" cy="57" r="19" fill="url(#fav-cam-lens)" />

  <!-- Aperture Accent -->
  <circle cx="50" cy="57" r="13" fill="#1e3a8a" />
  <circle cx="50" cy="57" r="8" fill="#38bdf8" />

  <!-- Glare Sparkle -->
  <circle cx="45" cy="52" r="3" fill="#ffffff" />

  <!-- Red Flash/Dot -->
  <circle cx="76" cy="35" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
</svg>